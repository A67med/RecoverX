name: RecoverX checks
on:
  push:
    branches: [main, "codex/**"]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install real forensic tools (synthetic test images only)
        run: |
          sudo apt-get update
          sudo apt-get install -y sleuthkit testdisk dosfstools e2fsprogs mtools
      - name: Install application and development tools
        run: python -m pip install -e '.[dev]'
      - name: Static checks and dependency consistency
        run: |
          python -m ruff check src scripts tests
          python -m pip check
      - name: Unit, security, real-engine and Streamlit tests
        run: python -m pytest -q
