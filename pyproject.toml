[project]
name = "recoverx"
version = "0.3.0"
description = "Evaluation of CART-based deleted-file recovery strategy selection over The Sleuth Kit and PhotoRec"
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-p no:cacheprovider -rs"
